[alembic]
# TSB-366 - operational migration layer (ASCII only: configparser reads this
# file with the platform default encoding, so non-ASCII breaks on Windows GBK).
#
# This is NOT the runtime schema path. The application still bootstraps with
# `app.database.init_db()` (create_all + the additive migration list + the
# storyboard triggers), which is what every test and every server start uses.
# Alembic exists so an operator can:
#
#   * stamp an existing database as "at the storyboard baseline";
#   * upgrade/downgrade the storyboard tables in isolation;
#   * read the schema change as a reviewable, reversible document.
#
# See docs/RELEASE_TSB_366.md for the exact operating procedure.
script_location = alembic
prepend_sys_path = .
# Resolved at runtime from TRAVELSB_DATA_DIR (see env.py); never stored here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
