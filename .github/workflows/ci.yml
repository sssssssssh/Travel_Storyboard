name: CI

on:
  push:
    branches: [main, "codex/**"]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Optional: only used to read the OTIO export back with the reference
      # implementation. The test skips itself when the wheel is unavailable, so
      # a platform without a build must not fail the job.
      - name: Install optional OTIO validator
        working-directory: backend
        continue-on-error: true
        run: pip install "opentimelineio>=0.17"

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q --ignore=tests/test_ffmpeg_integration.py --ignore=tests/test_cache_recovery.py

  media:
    name: Required FFmpeg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TSB_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Verify FFmpeg and FFprobe versions
        shell: bash
        run: |
          set -e
          ffmpeg -version
          ffprobe -version
      - name: Install Python dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run mandatory real-media and stability integration
        working-directory: backend
        run: python -m pytest -v -rA --junitxml=media-results.xml tests/test_ffmpeg_integration.py tests/test_cache_recovery.py tests/test_stability_jobs.py tests/test_checkpoints.py tests/test_story_direct.py tests/test_output_dir.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-results-${{ matrix.os }}
          path: backend/media-results.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Test draft persistence
        working-directory: frontend
        run: pnpm run test

      - name: Build
        working-directory: frontend
        run: pnpm run build
