name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Optional: only used to read the OTIO export back with the reference
      # implementation. The test skips itself when the wheel is unavailable, so
      # a platform without a build must not fail the job.
      - name: Install optional OTIO validator
        working-directory: backend
        continue-on-error: true
        run: pip install "opentimelineio>=0.17"

      # TSB-311: this job runs the whole suite, and several suites encode real
      # media in their fixtures (e.g. test_vision_motion.py's source_video).
      # Without a toolchain they used to ERROR with "Executable not found:
      # ffmpeg" rather than report a clean skip. Install FFmpeg here so those
      # tests genuinely run, and keep the mandatory-media job as the place where
      # a missing toolchain is a hard failure.
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y ffmpeg
          else
            echo "Using preinstalled FFmpeg/FFprobe."
          fi
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      # Verify the *binaries*, not just a Python package: TSB-311 explicitly
      # requires `ffmpeg -version` / `ffprobe -version` before pytest runs.
      - name: Verify FFmpeg and FFprobe versions
        shell: bash
        run: |
          set -e
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q --junitxml=backend-results.xml --ignore=tests/test_ffmpeg_integration.py --ignore=tests/test_cache_recovery.py

      # TSB-311: report collected/passed/skipped per job so "0 skipped" in the
      # mandatory-media job is provable from the log, not just asserted.
      - name: Report test counts
        if: always()
        working-directory: backend
        shell: python
        run: |
          import xml.etree.ElementTree as ET, pathlib, sys
          p = pathlib.Path("backend-results.xml")
          if not p.exists():
              print("no junit xml produced; pytest did not reach reporting")
              sys.exit(0)
          suite = ET.parse(p).getroot().find("testsuite") or ET.parse(p).getroot()
          total, failures, errors = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors"))
          skipped = int(suite.get("skipped", 0))
          print(f"backend job: collected={total} passed={total - failures - errors - skipped} "
                f"failures={failures} errors={errors} skipped={skipped}")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: backend/backend-results.xml

  media:
    name: Required FFmpeg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TSB_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y ffmpeg
          else
            echo "Using preinstalled FFmpeg/FFprobe; version verification and real-media tests remain mandatory."
          fi
      - name: Verify Windows default long-path policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 0
          $policy = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
          if ($policy -ne 0) { throw "LongPathsEnabled must be 0" }
          Write-Output "LongPathsEnabled=$policy"
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Verify FFmpeg and FFprobe versions
        shell: bash
        run: |
          set -e
          ffmpeg -version
          ffprobe -version
      - name: Install Python dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run mandatory real-media and stability integration
        working-directory: backend
        # This list is the *mandatory* set: the normal `backend` job already runs
        # the whole suite, but it does so without TSB_REQUIRE_FFMPEG, so a
        # silently skipped media test would pass there. Anything that must not
        # skip has to be named here — including the v2.0.5/v2.0.6 cancellation
        # and deep-path suites (TSB-251/252/253/254/261/262/263/264).
        run: >
          python -m pytest -v -rA --junitxml=media-results.xml
          tests/test_ffmpeg_integration.py
          tests/test_cache_recovery.py
          tests/test_stability_jobs.py
          tests/test_checkpoints.py
          tests/test_story_direct.py
          tests/test_output_dir.py
          tests/test_concurrent_annotations.py
          tests/test_hash_pipeline.py
          tests/test_review_validation.py
          tests/test_review_proxies.py
          tests/test_review_package_privacy.py
          tests/test_database_backup.py
          tests/test_long_paths.py
          tests/test_job_mutex.py
          tests/test_proxy_duration.py
          tests/test_job_cancel_kills_process.py
          tests/test_deep_media_http.py
          tests/test_deep_path_cleanup.py
          tests/test_deep_scan_api.py
          tests/test_cancel_lifecycle.py
          tests/test_cancel_cleanup.py
          tests/test_media_process_tree.py
          tests/test_cancel_recovery.py
          tests/test_ci_skip_guard.py
          tests/test_terminal_races.py
          tests/test_staging_ownership.py
          tests/test_analysis_cancel_commit.py
          tests/test_publish_cancel.py
          tests/test_cleanup_reporting.py
          tests/test_orphan_frame_safety.py
          tests/test_vision_provider.py
          tests/test_vision_schema.py
          tests/test_vision_semantics.py
          tests/test_vision_candidates.py
          tests/test_vision_motion.py
          tests/test_motion_verdict_continuity.py
          tests/test_vision_cache_versions.py
          tests/test_vision_commit_races.py
          tests/test_vision_transport_security.py
          tests/test_vision_staging_ownership.py
          tests/test_vision_route_wiring.py
          tests/test_vision_cleanup_status.py
          tests/test_release_version.py
          tests/test_media_format_matrix.py
          tests/test_vision_compat.py
          tests/test_native_video_capability.py
          tests/test_native_video_probe.py
          tests/test_native_video_provider.py
          tests/test_probe_clip_portability.py
          # TSB-342/343: the probe's evidence standard and the CI isolation
          # contract. Registration in the mandatory-media job means a refusal
          # path cannot turn into a silent skip.
          tests/test_probe_temporal_evidence.py
          tests/test_ci_environment_isolation.py
          # TSB-344: staging leaf substitution / link refusal. Must not be
          # downgraded to a silent skip, so it belongs in the mandatory job.
          tests/test_staging_leaf_substitution.py
          # TSB-337: a fallback must be an accounted outcome, never an empty
          # success. Required, so the distinction cannot silently rot.
          tests/test_video_fallback_execution.py
          # TSB-338: the running budget ledger. Required so an unbudgeted send
          # cannot slip through unnoticed.
          tests/test_video_budget_ledger.py
          tests/test_video_clip.py
          tests/test_video_schema.py
          tests/test_video_observation.py
          tests/test_video_job.py
          tests/test_video_api.py
          tests/test_video_ab.py
          # TSB-333/334: the switch-scope contract and the production wiring test.
          # The wiring test derives a real clip with FFmpeg and drives a real
          # loopback HTTP server, so it belongs in the mandatory-media job rather
          # than the job where a missing tool would skip silently.
          tests/test_video_model_switch_scope.py
          tests/test_video_provider_wiring.py
          # TSB-335: the capability store decides whether user video may be sent
          # at all; its refusals must not be able to turn into silent skips.
          tests/test_video_capability_store.py
      - name: Record exact commit and platform evidence
        if: always()
        working-directory: backend
        shell: python
        run: |
          import json, os, platform, subprocess
          evidence = {"head_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "platform": platform.platform(), "python": platform.python_version()}
          for executable in ("ffmpeg", "ffprobe"):
              proc = subprocess.run([executable, "-version"], capture_output=True, text=True)
              evidence[executable] = proc.stdout.splitlines()[0] if proc.stdout else proc.stderr[:200]
          if os.name == "nt":
              import winreg
              with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, r"SYSTEM\CurrentControlSet\Control\FileSystem") as key:
                  evidence["LongPathsEnabled"] = winreg.QueryValueEx(key, "LongPathsEnabled")[0]
          with open("media-platform.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, ensure_ascii=False, indent=2)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-results-${{ matrix.os }}
          path: |
            backend/media-results.xml
            backend/media-platform.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check release version metadata
        run: python scripts/sync_version.py --check

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Test draft persistence
        working-directory: frontend
        run: pnpm run test

      - name: Build
        working-directory: frontend
        run: pnpm run build
